<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xylofon Låtspelare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styleLatar.css" rel="stylesheet">
</head>

<body>
    <div class="mb-4 btn-back">
        <a href="karta.html" class="btn btn-secondary">← Tillbaka</a>
    </div>
    <div class="container">


        <h1 class="mb-4">Xylofon Låtspelare</h1>
        <h2 class="mb-4">Välj en låt</h2>

        <div class="list-group">
            <div class="list-group-item song-item">
                <div class="d-flex justify-content-between align-items-center">
                    <div><strong>Twinkle Twinkle Little Star</strong> - Barnvisa</div>
                    <button class="btn btn-primary" onclick="playSong('twinkle')">Spela låt</button>
                </div>
            </div>
        </div>
        <div class="mt-3 alert alert-info" id="statusMessage">Välj en låt att spela</div>
    </div>

    <script src="scriptLatar.js"></script>
</body>

<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xylofon Låtspelare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styleLatar.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Tillbaka-knapp -->
        <div class="mb-4">
            <a href="karta.html" class="btn btn-secondary">← Tillbaka till kartan</a>
        </div>

        <h1 class="mb-4">Xylofon Låtspelare</h1>

        <h2 class="mb-4">Välj en låt</h2>

        <!-- Låtlista -->
        <div class="list-group">
            <!-- Låt 1 -->
            <div class="list-group-item song-item" id="song1">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong>Twinkle Twinkle Little Star</strong> - Barnvisa
                    </div>
                    <button class="btn btn-sm btn-primary play-btn" onclick="playSong(1)" id="btn1">
                        Spela låt
                    </button>
                </div>
            </div>

            <!-- Låt 2 -->
            <div class="list-group-item song-item" id="song2">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong>Ode to Joy</strong> - Beethoven
                    </div>
                    <button class="btn btn-sm btn-primary play-btn" onclick="playSong(2)" id="btn2">
                        Spela låt
                    </button>
                </div>
            </div>

            <!-- Låt 3 -->
            <div class="list-group-item song-item" id="song3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong>Happy Birthday</strong> - Traditionell
                    </div>
                    <button class="btn btn-sm btn-primary play-btn" onclick="playSong(3)" id="btn3">
                        Spela låt
                    </button>
                </div>
            </div>
        </div>

        <!-- Stoppknapp -->
        <div class="mt-4">
            <button class="btn btn-danger" onclick="stopPlayback()">
                Stoppa uppspelning
            </button>
        </div>

        <!-- Statusmeddelande -->
        <div class="mt-3 alert alert-info" id="statusMessage">
            Välj en låt att spela
        </div>
    </div>

    <script src="scriptLatar.js"></script>
</body>

</html>

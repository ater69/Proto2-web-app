<!DOCTYPE html>
<html lang="en">

<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="Script.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="map"></div>
  <script>
    // Initialisera kartan
    var map = L.map('map', {
      minZoom: 10,
      maxZoom: 18
    }).setView([59.53, 18.074], 13);

    // Lägg till tile layer
    L.tileLayer('https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=574O0vWsBViNeScHREjJ', {
      attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>'
    }).addTo(map);

    // Lägg till en marker
    var marker = L.marker([59.53, 18.074]).addTo(map);

    // Koppla en popup till markern
    marker.bindPopup('<button type="button" class="btn btn-primary" id="saveButton">Välj bänk</button>')

    // Popup öppnas bara vid klick
    marker.on('click', function () {
      marker.openPopup();
    });
  </script>
</body>

</html>
